<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Informações Pessoais</h1>

<form action="index.html">
    
        <fieldset>
            <legend>Cadastro do Cliente</legend>
    
            <div>
                <label>Nome:</label>
                    <input type="text" size="50" maxlength="120" placeholder="Digite o nome do cliente">
            </div>
    
                <br>
    
            <div>
                <label>Idade:</label>
                    <input type="number" size="10" maxlength="10" placeholder="Digite a idade">
            </div>
    
                <br>
    
            <div>
                <label>Endereço:</label>
                    <input type="text" size="100" maxlength="150" placeholder="Digite o endereço">
            </div>
    
                <br>
    
            <div>
                <label>Cidade:</label>
                    <input type="text" size="50" maxlength="120" placeholder="Digite a cidade">
            </div>
    
                <br>
    
            <div>
                <label>Estado:</label>
                    <input type="text" size="2" maxlength="2" placeholder="UF">
            </div>
    
                <br>
    
            <div>
                <label>CEP:</label>
                    <input type="number" size="9" maxlength="9" placeholder="XXXXX-XXX">
            </div>
    
                <br>
    
            <div>
                <label>Tel/Res:</label>
                    <input type="number" size="9" maxlength="9" placeholder="99 99999-9999">
            </div>
    
                <br>
            <div>
                <label>Tel/Cel:</label>
                    <input type="number" size="9" maxlength="9" placeholder="99 99999-9999">
            </div>
    
                <br>
    
            <div>
                <label>Email:</label>
                    <input type="text" size="100" maxlength="120" placeholder="Digite o endereço de email">
            </div>
    
                <br>
    
        </fieldset>
    
                <br>
    
            <div>
                <center>
                    <input type="submit" value="enviar">
                </center>
            </div>
</form>

</body>
</html>
